[package]
name = "physics_plugin"
version = "0.1.0"
edition = "2021"
description = "Physics (`pulsar.physics`): the physics components, their Rapier simulation and the physics asset models; with `editor`, the asset editors. The plugin's root crate: `registrations` is the one place it registers what it contributes"

[lib]
crate-type = ["cdylib", "rlib"]
name = "physics_plugin"

[features]
# Statically linked hosts use the Rust API and must not emit the
# process-global dynamic loader symbols shared by every plugin.
builtin = []
# The asset editors, the file type definitions, the editor provider and the
# DLL entry point (`export_plugin!` without `builtin`). A game links the crate
# without it.
editor = [
    "dep:plugin_manager",
    "dep:ui_level_editor",
    "dep:ui",
    "dep:gpui-ce",
    "dep:plugin_editor_api",
    "pulsar_reflection/prims-gpui",
]

[dependencies]
# Its World Settings fields (`ui_level_editor::extend::WorldSettingField`, with `editor`).
ui_level_editor = { workspace = true, optional = true }
# The plugin's descriptor and its registrations' origin.
pulsar_plugins = { workspace = true }
plugin_manager = { workspace = true, optional = true }
# The derive of every reflected unit enum names GPUI (its property panel
# dropdown, `pulsar_reflection_derive`), so the components need it even
# without the editor.
gpui-ce = { workspace = true, optional = true }
ui = { workspace = true, optional = true }
plugin_editor_api = { workspace = true, optional = true }
engine_class_derive = { workspace = true }
# The skeletal rig finds a mesh's physics asset through the project's file
# index (`engine_fs::open_project_file_index`).
engine_fs = { workspace = true }
engine_state = { workspace = true }
# Animated skeletons are the animation plugin's: the rig reads and drives
# them through the core contract (`helio_component::skinning`).
helio_component = { workspace = true }
# Reflection; the GPUI-typed prims only with `editor` (the physics editors).
pulsar_reflection = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_events = { workspace = true }
profiling = { workspace = true }
inventory = { workspace = true }
rapier3d = { workspace = true }
glam = { workspace = true }
skeletal_assets = { workspace = true }
# The plugin's contracts other plugins read: the `.physasset` schema.
physics_api = { workspace = true }
# The scene rows physics provides (water hitboxes), registered with the
# engine's GPU mirror through `SceneRowsRegistration`.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
# Water's api: the hitbox rows bodies on the WaterSim channel derive.
helio-water-api = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
# `#[derive(SceneStore)]` output names `::wgpu` directly.
wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Headless rendering of the editors (`gpui::TestAppContext`, `#[gpui::test]`),
# the same set-up the UI crate's own tests use. Only test builds see it.
gpui-ce = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
