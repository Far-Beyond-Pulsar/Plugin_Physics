category = "Physics"
world_registered = true
own_gpu_columns = false
owner = "physics_plugin::components::character_controller"
disposition = "non-render: physics plugin data (a kinematic character controller); the plugin's runtime reads its change journal and sends what changed to its Rapier counterpart on the simulation thread. Nothing on the GPU reads it"
target_contract = "Phase 5; 04-state-notifications.md"
test = "plugins/vendor/physics_plugin/src/runtime.rs (a_character_controller_walks_and_lands)"
status = "verified"

