# The physics_plugin plugin's rows of the SceneDB closure ledger (Pulsar-Native#1035):
# its classes, GPU schemas, buffers, pass crates and call sites. A plugin owns
# the rows of what it ships (Pulsar-Native#1606); `cargo test -p scene_inventory`
# in a Pulsar-Native checkout recomputes every fact column, checks the human
# columns, and fails on a missing, stale or misplaced row. The columns are
# described in Pulsar-Native's crates/core/scene_inventory/ledger.toml.

# ── Exposed component classes ───────────────────────────────────

[[class]]
name = "PhysicsComponent"
category = "Physics"
world_registered = true
own_gpu_columns = true
owner = "physics_plugin::components::legacy::physics_component"
disposition = "physics subsystem data; SceneDB is the physics world (nothing is synced to a separate one). A body on the WaterSim collision channel (#1080) derives a WaterHitboxSourceRow on every insert, write, removal and replay, which the environment join bounds by the owner's meshes into water_hitboxes; its generated GPU companion uploads nothing"
target_contract = "Phase 3; 02-typed-reflection-and-writes.md"
test = "crates/editor/ui_level_editor/src/core/scene_edit/tests/components.rs physics_world_edits_survive_object_updates_and_save_projection, disabling_and_reenabling_physics_preserves_the_canonical_value; plugins/installed/tests/render_acceptance.rs (bodies_on_the_water_sim_channel_push_the_water); plugins/vendor/water/tests/scene_rows.rs (bodies_on_the_water_sim_channel_become_water_hitboxes)"
status = "verified"

[[class]]
name = "RigidbodyComponent"
category = "Physics"
world_registered = true
own_gpu_columns = false
owner = "physics_plugin::components::legacy::rigidbody_component"
disposition = "non-render: physics subsystem data; typed lifecycle only. Its generated GPU companion is unregistered and has no consumer"
target_contract = "Phase 3; 02-typed-reflection-and-writes.md"
test = "crates/editor/ui_level_editor/src/core/scene_edit/tests/components.rs rigidbody_add_edit_undo_and_save_are_typed"
status = "verified"

[[class]]
