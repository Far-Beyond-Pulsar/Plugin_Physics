# ── GPU-bearing schemas ─────────────────────────────────────────

[[schema]]
type = "PhysicsComponent"
path = "physics_plugin::components::legacy::physics_component::component::PhysicsComponent"
buffers = []
clears_on_remove = true
releases_var_len = false
registered = false
writer = "the authored value's SceneDB GPU dispatch is its derived WaterHitboxSourceRow (the physics plugin's water rows), on every insert, write, removal and replay; the generated companion uploads nothing"
owner = "physics_plugin::components::legacy::physics_component"
disposition = "keep: the authored type's GPU row is WaterHitboxSourceRow, the environment join's water hitbox input"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/installed/tests/render_acceptance.rs (bodies_on_the_water_sim_channel_push_the_water); plugins/vendor/water/tests/scene_rows.rs (bodies_on_the_water_sim_channel_become_water_hitboxes)"
status = "verified"

[[schema]]
type = "WaterHitboxSourceRow"
path = "physics_plugin::components::legacy::physics_component::water::WaterHitboxSourceRow"
buffers = ["water_hitbox_sources"]
clears_on_remove = true
releases_var_len = false
registered = true
writer = "PhysicsComponent's derived GPU registration (edge softness, strength and the interaction flag; zero unless enabled, colliding and on the WaterSim channel), on every insert, write, removal and replay"
owner = "physics_plugin::components::legacy::physics_component::water"
disposition = "keep: the environment join's water hitbox input (#1080)"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/installed/tests/render_acceptance.rs (bodies_on_the_water_sim_channel_push_the_water); plugins/vendor/water/tests/scene_rows.rs (bodies_on_the_water_sim_channel_become_water_hitboxes)"
status = "verified"

[[schema]]
type = "PhysicsComponentGpuMirror"
path = "physics_plugin::components::legacy::physics_component::component::PhysicsComponentGpuMirror"
buffers = []
clears_on_remove = true
releases_var_len = false
registered = false
writer = "none: the generated companion uploads a GPU row only for an #[engine_class(gpu_rows)] class (Phase 4); no engine class opts in"
owner = "physics_plugin::components::legacy::physics_component::component"
disposition = "keep as a CPU mapping type (LightComponent's derived LightSourceRow is built from its mirror); nothing is uploaded"
target_contract = "Phase 1; 03-gpu-reflection-and-rendering.md"
test = "crates/core/engine_class_derive/tests/gpu_mirror_derive.rs (without_gpu_rows_the_companion_uploads_nothing)"
status = "verified"

[[schema]]
type = "RigidbodyComponentGpuMirror"
path = "physics_plugin::components::legacy::rigidbody_component::component::RigidbodyComponentGpuMirror"
buffers = []
clears_on_remove = true
releases_var_len = false
registered = false
writer = "none: the generated companion uploads a GPU row only for an #[engine_class(gpu_rows)] class (Phase 4); no engine class opts in"
owner = "physics_plugin::components::legacy::rigidbody_component::component"
disposition = "keep as a CPU mapping type (LightComponent's derived LightSourceRow is built from its mirror); nothing is uploaded"
target_contract = "Phase 1; 03-gpu-reflection-and-rendering.md"
test = "crates/core/engine_class_derive/tests/gpu_mirror_derive.rs (without_gpu_rows_the_companion_uploads_nothing)"
status = "verified"

# ── GPU buffer keys ─────────────────────────────────────────────

[[buffer]]
key = "water_hitbox_sources"
producers = ["WaterHitboxSourceRow"]
consumers = []
owner = "physics_plugin::components::legacy::physics_component::water"
disposition = "keep: PhysicsComponent's water interaction, derived on every write; the environment join reads it into water_hitboxes"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/installed/tests/render_acceptance.rs (bodies_on_the_water_sim_channel_push_the_water); plugins/vendor/water/tests/scene_rows.rs (bodies_on_the_water_sim_channel_become_water_hitboxes)"
status = "verified"

# ── Lifecycle call sites ────────────────────────────────────────

[[site]]
pattern = "change-cursor"
file = "plugins/vendor/physics_plugin/src/runtime.rs"
count = 5
owner = "physics_plugin::runtime (tick: read_moves, read_parts)"
disposition = "keep: one cursor per registered physics behavior's component plus ComponentOwner and Transform; each frame sends the simulation only what those journals report (a Transform the simulation did not write is a move by someone else), and an idle scene sends only the elapsed time; an overflowed cursor resends the behavior's rows"
target_contract = "Phase 5; 04-state-notifications.md"
test = "plugins/vendor/physics_plugin/src/runtime.rs (an_idle_scene_sends_nothing_to_the_simulation, editing_a_component_updates_its_physics_partner, removing_the_body_component_ends_its_simulation)"
status = "verified"
