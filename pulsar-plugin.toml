# The `pulsar.physics` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its editors and file types are
# absent (see crates/core/pulsar_plugins). Its root crate carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.physics"
name = "Physics"
description = "Rigid bodies, colliders and joints (Rapier), physics materials and collision layers, and their editors"
enabled_by_default = true
provides = [
    { id = "pulsar.physics.api", kind = "api", members = ["physics_api"], version = 1 },
]
requires = [
    { id = "pulsar.animation.api", optional = true },
    { id = "pulsar.water.api", optional = true },
]

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. A game links it without its `editor`
# feature; the editor links it with.
root = "physics_plugin"
